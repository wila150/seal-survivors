  #stunbar{display:none;margin-top:3px;position:relative;padding-left:26px;text-align:left}

    /* 升級卡：手機改橫的（左圖示、右文字），三張一起看得到 */
    #cards{flex-direction:column;flex-wrap:nowrap;gap:12px;width:100%;max-width:520px}
    .card{width:100%;min-height:0;display:grid;grid-template-columns:72px 1fr;column-gap:12px;row-gap:2px;align-items:center;justify-items:start;text-align:left;padding:22px 14px 12px}
    .card:hover{transform:none}
    .card>.skico.big,.card>img{grid-row:1 / span 6;grid-column:1;zoom:.72;margin:0!important}
    .card>b,.card>.kind,.card>small,.card>.fhint{grid-column:2}
    .card b{font-size:18px}.card .kind{margin-top:0}.card hr{display:none}.card small{font-size:13px;line-height:1.45}
    .card .num{display:none}.card .rb{left:10px;transform:none;border-radius:0 0 10px 10px}
    .card .fhint{margin-top:4px;font-size:11px}
    /* 11/21 使用者：「三選一還是會有大有小」→ 三張卡一樣高（以最高那張為準）、數值排兩欄、超武提示的技能名不放大 */
    #cards{display:grid;grid-auto-rows:1fr;gap:10px}
    #levelup{z-index:12;overflow-y:auto;justify-content:flex-start;gap:10px}#levelup>:first-child{margin-top:auto}#levelup>:last-child{margin-bottom:auto}#levelup h1{margin:0;font-size:30px} /* 蓋過右下大招鈕；小螢幕放不下就可以捲 */
    .card{padding:20px 12px 10px;align-content:center}
    .card>small{columns:2;column-gap:14px;line-height:1.4}
    .card .fhint b{font-size:inherit}
  }
  /* 項目 54：手機右側拇指位置的馬頭鈕（冷卻好了發光）；電腦維持原本按鈕 */
  #mountBtn{--cd:0}#mountBtn.ready{box-shadow:0 0 0 3px #fff6,0 0 16px #ffd36b}
  @media (pointer:coarse),(max-width:600px){#mountBtn{right:10px;bottom:auto;top:58%;width:62px;height:62px;border-radius:50%;padding:0;font-size:0;background:radial-gradient(#ffd98aee,#e08a20ee);border:3px solid #fff8}
    #mountBtn::before{content:"🐴";font-size:30px;line-height:56px}
    #mountBtn::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(#0009 calc(var(--cd)*360deg),transparent 0)}}
</style>
