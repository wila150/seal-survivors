  .pcgold{display:flex;align-items:center;gap:8px;margin-top:8px;background:#f1ebe0;border:2px solid #b9ab9f;border-radius:20px;padding:4px 6px 4px 14px;font-weight:900;color:#7a5a3c}

// 範圍：廣場中心 ±40（8×8 格、每格 10）；原版色調圖 1px＝1 單位；預設鏡頭轉了 180 度（城堡在上），地圖也轉 180 度
const TMM = { R: 40, img: new Image(), icons: new Image(), last: 0 };

// 原版小地圖 NPC 圖示（interface/minimapicon.tex，32px 格子 [欄, 列]）
const NPC_ICON = { captain: [4, 0], job: [5, 1], shop: [7, 0], smith: [7, 1], storage: [3, 2], rank: [4, 2], library: [3, 0], mount: [7, 2], auction: [3, 1],
  stylist: [1, 0], ident: [5, 0], zaro: [0, 1], mail: [1, 2], rebirth: [6, 2], fish: [1, 3], pet: [0, 2] };
function drawTownMap(cv, big = false) {
  const g = cv.getContext('2d'), S = cv.width, M = big ? 22 : 14, A = S - M, R = TMM.R, cell = A / 8;
  const P = (x, z) => [M + (1 - (x - (TC.x - R)) / (2 * R)) * A, (1 - (z - (TC.z - R)) / (2 * R)) * A];
  g.clearRect(0, 0, S, S); g.fillStyle = '#d9c9a6'; g.fillRect(0, 0, S, S);
  if (TMM.img.complete && TMM.img.naturalWidth) { g.save(); g.translate(M + A, A); g.scale(-1, -1); g.drawImage(TMM.img, TC.x + 256 - R, TC.z + 256 - R, 2 * R, 2 * R, 0, 0, A, A); g.restore(); }
  g.strokeStyle = '#ffffff70'; g.lineWidth = 1; g.beginPath();
  for (let i = 0; i <= 8; i++) { g.moveTo(M + i * cell, 0); g.lineTo(M + i * cell, A); g.moveTo(M, i * cell); g.lineTo(M + A, i * cell); } g.stroke();
  g.fillStyle = '#5a4630'; g.font = `bold ${big ? 13 : 9}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i = 0; i < 8; i++) { g.fillText('ABCDEFGH'[i], M + (i + 0.5) * cell, A + M / 2); g.fillText(String(8 - i), M / 2, (i + 0.5) * cell); }
  // NPC：圓點＋名字第一個字（放大時顯示全名）
  for (const n of NPCS) { const [x, y] = P(n.x, n.z), r = big ? 11 : 7, ic = NPC_ICON[n.id];
    if (ic && TMM.icons.complete && TMM.icons.naturalWidth) g.drawImage(TMM.icons, ic[0] * 32, ic[1] * 32, 32, 32, x - r, y - r, r * 2, r * 2); // 原版圖示
    else { g.beginPath(); g.arc(x, y, r * 0.75, 0, 7); g.fillStyle = '#' + n.color.toString(16).padStart(6, '0'); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.stroke(); }
    if (big) { g.fillStyle = '#2a1f12'; g.font = 'bold 11px sans-serif'; g.fillText(n.name.split(' ')[0], x, y + r + 8); } }
  // 玩家箭頭（方向＝角色面向；地圖轉了 180 度所以 x、z 都反過來）
  const [px, py] = P(player.position.x, player.position.z), fx = -Math.sin(player.rotation.y), fy = -Math.cos(player.rotation.y), L = big ? 12 : 8;
  g.save(); g.translate(px, py); g.rotate(Math.atan2(fy, fx) + Math.PI / 2); g.beginPath(); g.moveTo(0, -L); g.lineTo(L * 0.65, L * 0.7); g.lineTo(0, L * 0.3); g.lineTo(-L * 0.65, L * 0.7); g.closePath();
  g.fillStyle = '#ff3b30'; g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 2; g.stroke(); g.restore();
  return P;
}

      <small style="color:#6b7896">　共 ${r.total ?? 0} 名・每 30 秒更新（${new Date(r.at || Date.now()).toLocaleTimeString()}）・藍框＝你的角色</small></div>

// ===== 項目 20：郵差（信箱：系統信＋附件領取、可丟掉）=====
let mails = null, mSel = null;

    <div class="detail">${m ? `<b>${m.title.replace(/</g, '&lt;')}</b>　<small>寄件人：${m.sender}</small><p>${m.body.replace(/</g, '&lt;')}</p>${has(m) ? `<p>附件：${attachHtml(m)}</p>` : ''}
      <div class="acts">${has(m) && !m.claimed ? `<button class="btn primary" id="mClaim">領取</button>` : ''}<button class="btn" id="mDel">丟掉這封</button></div>` : '<small>點一封信來看</small>'}</div>`;
  openDlg(`郵差（${mails.length} 封）`, html, [['全部領取', () => claim('all'), true], ['丟掉已讀且已領取的', () => del(mails.filter(x => x.read && (x.claimed || !has(x))).map(x => x.id))]], true);
  const b = $('#dlgBody');

  $('#mClaim')?.addEventListener('click', () => claim(mSel));

  async function claim(id) {
    try { const r = await call('POST', '/api/mailclaim', { charId: CHAR.id, mailId: id }); mails = r.mails; showChar(r.char); openMail(false);
      toast(r.claimed ? `領取了 ${r.claimed} 封信的附件${r.full ? '（背包滿了，有些沒領）' : ''}` : r.full ? '背包滿了' : '沒有可以領的附件'); } catch (e) { toast(e.message); }

// ===== 項目 18：倉庫管理員（帳號共用倉庫：分頁 1～6、分類、搜尋、排序；點背包＝存入、點倉庫＝取回）=====
let stash = null, sPage = 0, sCat = 'all', sQ = '', sSort = 'rarity';
async function openStash(refetch = true) {
  if (refetch || !stash) { try { stash = await call('GET', '/api/stash'); } catch (e) { return toast(e.message); } }
  const c = CHAR, S = stash, locked = sPage >= S.unlocked;
  const ok = it => (sCat === 'all' || it.slot === sCat) && (!sQ || itemName(it).includes(sQ) || RARITY[it.rarity].name.includes(sQ));
  const sorter = { rarity: (a, b) => b.rarity - a.rarity || b.refine - a.refine, refine: (a, b) => b.refine - a.refine || b.rarity - a.rarity, slot: (a, b) => a.slot.localeCompare(b.slot) || b.rarity - a.rarity, new: (a, b) => b.id - a.id }[sSort];
  const bag = (c.items || []).filter(ok).sort(sorter), page = S.items.filter(i => i.page === sPage), shown = page.filter(ok).sort(sorter);
  const cell = (it, attr) => `<div class="cell ${it.equipped ? 'eqd' : ''}" ${attr}="${it.id}" style="border-color:${RARITY[it.rarity].color}" title="${RARITY[it.rarity].name} ${itemName(it)}${it.equipped ? '（穿著中，不能存）' : ''}"><img src="${itemIcon(it)}" alt="">${it.refine ? `<b>+${it.refine}</b>` : ''}</div>`;
  const html = `<div class="tabs2" style="flex-wrap:wrap">${S.names.map((n, i) => `<button class="btn ${sPage === i ? 'primary' : ''}" data-sp="${i}">${i < S.unlocked ? n : `🔒 ${i + 1}`}</button>`).join('')}</div>
    ${locked ? `<p>這一頁還沒解鎖。${sPage === S.unlocked ? `<button class="btn primary" id="sUnlock" ${c.gold < S.cost[sPage] ? 'disabled' : ''}>花 ${S.cost[sPage]} 金幣解鎖</button>` : `<small>要先解鎖前面的分頁</small>`}</p>` : `
    <div class="tabs2" style="flex-wrap:wrap;align-items:center">${[['all', '全部'], ...Object.entries(SLOTS)].map(([k, v]) => `<button class="btn ${sCat === k ? 'primary' : ''}" data-sc="${k}">${v}</button>`).join('')}
      <input id="sQ" placeholder="搜尋名稱或品質" value="${sQ.replace(/"/g, '')}" style="width:130px">
      <select id="sSort">${[['rarity', '品質'], ['refine', '精煉'], ['slot', '部位'], ['new', '最新']].map(([k, v]) => `<option value="${k}" ${sSort === k ? 'selected' : ''}>排序：${v}</option>`).join('')}</select>
      <button class="btn" id="sRename">改名</button></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="flex:1;min-width:220px"><b>背包</b> <small>${(c.items || []).length}/40・點一下＝存入</small><div class="bag">${bag.map(it => cell(it, 'data-sput')).join('') || '<small>沒有</small>'}</div>
        <button class="btn" id="sPutAll">存入全部沒穿的</button></div>
      <div style="flex:1;min-width:220px"><b>${S.names[sPage]}</b> <small>${page.length}/${S.size}・點一下＝取回</small><div class="bag">${shown.map(it => cell(it, 'data-stake')).join('') || '<small>空的</small>'}</div>
        <button class="btn" id="sTakePage">取出這一頁</button><button class="btn" id="sTakeAll">全部取出</button></div>
    </div>`}
    <p><small>倉庫是整個帳號共用的，換角色也拿得到。穿著中的裝備不能存。</small></p>`;
  openDlg(`倉庫管理員（${S.items.length} 件）`, html, [], true);
  const b = $('#dlgBody');
  const put = async ids => { if (!ids.length) return toast('沒有可以存的'); try { const r = await call('POST', '/api/stashput', { charId: CHAR.id, itemIds: ids, page: sPage }); stash = r.stash; showChar(r.char); openStash(false); } catch (e) { toast(e.message); } };
  const take = async ids => { if (!ids.length) return toast('沒有可以取的'); try { const r = await call('POST', '/api/stashtake', { charId: CHAR.id, itemIds: ids }); stash = r.stash; showChar(r.char); openStash(false); if (r.left) toast(`背包滿了，還有 ${r.left} 件沒取`); } catch (e) { toast(e.message); } };
  b.querySelectorAll('[data-sp]').forEach(x => x.onclick = () => { sPage = +x.dataset.sp; openStash(false); });
  b.querySelectorAll('[data-sc]').forEach(x => x.onclick = () => { sCat = x.dataset.sc; openStash(false); });
  b.querySelectorAll('[data-sput]').forEach(x => x.onclick = () => { const it = CHAR.items.find(i => i.id === +x.dataset.sput); if (it?.equipped) return toast('穿著中的裝備不能存'); put([+x.dataset.sput]); });
  b.querySelectorAll('[data-stake]').forEach(x => x.onclick = () => take([+x.dataset.stake]));
  $('#sPutAll')?.addEventListener('click', () => put((CHAR.items || []).filter(i => !i.equipped).map(i => i.id).slice(0, S.size - page.length)));
  $('#sTakePage')?.addEventListener('click', () => take(page.map(i => i.id)));
  $('#sTakeAll')?.addEventListener('click', () => take(S.items.map(i => i.id)));
  $('#sSort')?.addEventListener('change', e => { sSort = e.target.value; openStash(false); });
  const q = $('#sQ'); q?.addEventListener('input', () => { sQ = q.value.trim(); const pos = q.selectionStart; openStash(false); const q2 = $('#sQ'); q2.focus(); q2.setSelectionRange(pos, pos); });
  $('#sUnlock')?.addEventListener('click', async () => { try { const r = await call('POST', '/api/stashunlock', { charId: CHAR.id }); stash = r.stash; showChar(r.char); openStash(false); toast('解鎖了新的倉庫分頁'); } catch (e) { toast(e.message); } });
  $('#sRename')?.addEventListener('click', async () => { const n = await askText('新的分頁名稱（1～10 個字）', S.names[sPage], { max: 10 }); if (!n) return; try { stash = await call('POST', '/api/stashname', { page: sPage, name: n }); openStash(false); } catch (e) { toast(e.message); } });
}

    if (a === 'lock') act('/api/lock', { itemId: id }, r => r.locked ? '已鎖定（不會被一鍵餵食／分解／賣掉）' : '已解鎖');
    if (a === 'sell') act('/api/sell', { itemId: id }, r => { selItem = null; return `賣得 ${r.price} 金幣`; });
    if (a === 'refine') {
      const cur = (CHAR.items || []).find(i => i.id === id);
      const protect = b.dataset.protect === '1';
      if (refineBreaks(cur.refine) && !protect && !(await askConfirm(`+${cur.refine} → +${cur.refine + 1} 失敗會碎掉，確定要強化？`, { danger: true }))) return;
      act('/api/refine', { itemId: id, protect }, r => { if (r.result === 'broken') selItem = null; return { ok: '強化成功！', down: '強化失敗，降了一級…', broken: '強化失敗，裝備碎掉了！' }[r.result]; });
    }
    if (a === 'gup') act('/api/gup', { itemId: id, box: b.dataset.box }, r => r.result === 'ok' ? `G 化成功！變成 ${r.tag}` : 'G 化失敗，材料用掉了…');
  });
}
// 項目 28：裝備上的技能屬性
function identLine(it) {
  if (!IDENT_SLOTS.includes(it.slot)) return '';
  if (!it.ident) return '<small style="color:#8a94a8">技能屬性：尚未鑑定（找廣場的技能鑑定師 魯魯）</small><br>';
  const n = TAL && identNode(TAL, it.ident); if (!n) return '';
  const own = it.ident.job === CHAR.job, br = it.ident.tree === 0 ? '' : TAL.jobs[it.ident.job]?.branches.find(b => b.key === it.ident.tree)?.name;
  const learned = own && (it.ident.tree === 0 ? CHAR.talents : it.ident.tree === CHAR.job2 ? CHAR.talents2 : null)?.[n.id] > 0;
  return `<small style="color:#2b6fd6"><b>技能屬性：${n.name} Lv+${it.ident.lv}</b>（${it.ident.job}${br ? '・' + br : ''}）${learned ? '' : '<span style="color:#c0392b">　目前沒有生效：要點過這個天賦才會提升</span>'}</small><br>`;
}
function itemDetail(it) {
  let h = `<b style="color:${RARITY[it.rarity].color}">${RARITY[it.rarity].name} ${itemName(it)}</b>　<small>${SLOTS[it.slot]}${it.bound ? '　🔒 綁定帳號（不能交易）' : ''}</small><br>${identLine(it)}${statLine(it)}<div class="acts">`;
  if (bagMode === 'smith') {
    if (it.refine >= REFINE_MAX) h += '<small>已經強化到最高了</small>';
    else h += `<button class="btn primary" data-act="refine" data-item="${it.id}">精煉 +${it.refine} → +${it.refine + 1}（${Math.round(REFINE_RATE[it.refine] * 100)}%，用 1 個${ORES[oreFor(it)].name}，持有 ${CHAR.mats?.[oreFor(it)] || 0}）</button>${refineBreaks(it.refine) ? '<small style="color:#c0392b">失敗會碎</small>' : it.refine >= 3 ? '<small>失敗會降一級</small>' : ''}`;
    if (it.refine < REFINE_MAX && refineBreaks(it.refine)) h += `<button class="btn" data-act="refine" data-protect="1" data-item="${it.id}" ${CHAR.mats?.abis > 0 ? '' : 'disabled'}>🛡 用艾彼斯的祝福精煉（失敗不碎、降 1 級；持有 ${CHAR.mats?.abis || 0}）</button>`; // 項目 55
    // 項目 46：G 化（一般 → G → DG → XG），寶石在裝備商人「購買」分頁；有 G 化工具箱可以一起用
    if ((it.gup || 0) >= GUP_MAX) h += '<small>已經是 XG（最高）</small>';
    else { const nx = GUP[(it.gup || 0) + 1], have = CHAR.mats?.[nx.gem] || 0, pct = Math.round(gupRate(it) * 100);
      h += `<button class="btn" data-act="gup" data-item="${it.id}" style="border-color:#${nx.glow.toString(16)}">G 化 → ${nx.tag}（${pct}%，用 1 個${ORES[nx.gem].name}，持有 ${have}）</button>`;
      for (const bx of ['gbox80', 'gbox100']) if (CHAR.mats?.[bx] > 0) h += `<button class="btn" data-act="gup" data-box="${bx}" data-item="${it.id}">＋${ORES[bx].name}（持有 ${CHAR.mats[bx]}）</button>`;
      h += '<small>失敗只會用掉材料，裝備不變</small>'; }
  } else {
    h += it.equipped ? `<button class="btn" data-act="unequip" data-item="${it.id}">卸下</button>` : `<button class="btn primary" data-act="equip" data-item="${it.id}">裝備</button>`;
    if (!it.equipped && !it.locked) h += `<button class="btn" data-act="sell" data-item="${it.id}">賣出（${sellPrice(it)} 金幣）</button>`;
    h += `<button class="btn" data-act="lock" data-item="${it.id}">${it.locked ? '🔓 解鎖' : '🔒 鎖定'}</button>${offJob(it, CHAR.job) ? '<small style="color:#8a7a6a">非本職業</small>' : ''}`;
  }
  return h + '</div>';
}
async function act(url, data, msg) {
  try {
    const r = await call('POST', url, data); const c = r.char || r; showChar(c);
    const m = msg ? msg(r) : null; renderBag(); if (m) toast(m);
  } catch (e) { toast(e.message); }
}
function toast(m) {
  const el = document.createElement('div'); el.textContent = m;
  el.style.cssText = 'position:fixed;left:50%;top:20%;transform:translateX(-50%);background:#26324dee;color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;z-index:99;pointer-events:none';
  document.body.appendChild(el); setTimeout(() => el.remove(), 1800);
}

// ===== 主迴圈 =====
const v = new THREE.Vector3(); let last = performance.now(), raf, townMoving = false;
// 看門狗（?debug=1 顯示面板）：主城邊界、穿模、動作卡住、模型載入失敗
const wd = createWatchdog({ page: '主城', renderer, scene, counts: () => ({ NPC: NPCS.length }), player, home: START,
  bounds: { minX: TC.x - TOWN, maxX: TC.x + TOWN, minZ: TC.z - TOWN, maxZ: TC.z + TOWN }, actor: () => pActor, moving: () => townMoving });
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const A of npcActors) A.update(dt);
  if (dlgOpen) { pActor?.update(dt, false); townMoving = false; }
  if (!dlgOpen) {
    let mx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.dx;
    let mz = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0) + joy.dy;
    { const c = Math.cos(view.yaw), sn = Math.sin(view.yaw), x = mx * c + mz * sn; mz = -mx * sn + mz * c; mx = x; } // 方向跟著視角
    if (Math.hypot(mx, mz) > 0.05) click.on = false;
    else if (click.on) { const dx = click.x - player.position.x, dz = click.z - player.position.z, d = Math.hypot(dx, dz); if (d < 0.35) click.on = false; else { mx = dx / d; mz = dz / d; } }
    const ml = Math.hypot(mx, mz); if (ml > 1) { mx /= ml; mz /= ml; }
    pActor?.update(dt, ml > 0.05); townMoving = ml > 0.05;
    if (ml > 0.05) {
      const p = player.position; if (!walkMove(TMAP, p, p.x + mx * 7 * dt, p.z + mz * 7 * dt)) click.on = false; { let d = Math.atan2(mx, mz) - player.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); player.rotation.y += d * Math.min(1, dt * 14); } // 平滑轉身
      for (const s of solids) { const dx = p.x - s.x, dz = p.z - s.z, d = Math.hypot(dx, dz), r = s.r + 0.45; if (d < r && d > 0.001) { p.x = s.x + dx / d * r; p.z = s.z + dz / d * r; } }
    }
  }
  const p = player.position;
  // 最近的 NPC
  let best = null, bd = 3.2;
  for (const n of NPCS) { const d = Math.hypot(n.x - p.x, n.z - p.z); if (d < bd) { bd = d; best = n; } }
  if (best !== nearNpc) { nearNpc = best; const t = $('#talk'); t.style.display = best ? 'block' : 'none'; if (best) t.innerHTML = `與${esc(best.name)}交談<kbd>空白鍵</kbd>`; }
  // 鏡頭
  { const gy = TMAP.heightAt(p.x, p.z), z = view.zoom, sy = Math.sin(view.yaw), cy = Math.cos(view.yaw);
    camera.position.set(p.x + sy * 12 * z, gy + 14 * z * view.pitch, p.z + cy * 12 * z); camera.lookAt(p.x, gy + 0.6, p.z);
    sun.position.set(p.x - 14, gy + 26, p.z + 10); sun.target.position.set(p.x, gy, p.z); sun.target.updateMatrixWorld(); }
  { const restore = liftScene(scene, TMAP.heightAt); renderer.render(scene, camera); restore(); } // 畫面抬到地面高度
  // 名牌
  const place = (obj, el, h) => { v.copy(obj.position); v.y += h + TMAP.heightAt(obj.position.x, obj.position.z); v.project(camera); el.style.display = v.z < 1 ? 'block' : 'none'; el.style.left = (v.x * 0.5 + 0.5) * innerWidth + 'px'; el.style.top = (-v.y * 0.5 + 0.5) * innerHeight + 'px'; };
  for (const n of NPCS) { place(n.obj, n.el, 2.6); n.el.classList.toggle('near', n === nearNpc); }
  place(player, meLbl, 2.6);
  wd.tick(dt);
  tickTownMap(now); // PC 小地圖（每 0.2 秒）
  raf = requestAnimationFrame(loop);
}
raf = requestAnimationFrame(loop);
window.__town = { player, map: TMAP, center: TC }; // 測試用（無頭截圖）
moduleReady();
// 切到背景就停
document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf); else { last = performance.now(); raf = requestAnimationFrame(loop); } });
</script>
