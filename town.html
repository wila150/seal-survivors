// 原版小地圖 NPC 圖示（interface/minimapicon.tex，32px 格子 [欄, 列]）
const NPC_ICON = { monk: [5, 0], captain: [4, 0], job: [5, 1], shop: [7, 0], smith: [7, 1], storage: [3, 2], rank: [4, 2], library: [3, 0], mount: [7, 2], auction: [3, 1],

function drawTownMap(cv, big = false) {
  const g = cv.getContext('2d'), S = cv.width, M = big ? 22 : 14, A = S - M, R = TMM.R, cell = A / 8;
  const P = (x, z) => [M + (1 - (x - (TC.x - R)) / (2 * R)) * A, (1 - (z - (TC.z - R)) / (2 * R)) * A];
  g.clearRect(0, 0, S, S); g.fillStyle = '#d9c9a6'; g.fillRect(0, 0, S, S);
  if (TMM.img.complete && TMM.img.naturalWidth) { g.save(); g.translate(M + A, A); g.scale(-1, -1); g.drawImage(TMM.img, TC.x + 256 - R, TC.z + 256 - R, 2 * R, 2 * R, 0, 0, A, A); g.restore(); }
  g.strokeStyle = '#ffffff70'; g.lineWidth = 1; g.beginPath();
  for (let i = 0; i <= 8; i++) { g.moveTo(M + i * cell, 0); g.lineTo(M + i * cell, A); g.moveTo(M, i * cell); g.lineTo(M + A, i * cell); } g.stroke();
  g.fillStyle = '#5a4630'; g.font = `bold ${big ? 13 : 9}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i = 0; i < 8; i++) { g.fillText('ABCDEFGH'[i], M + (i + 0.5) * cell, A + M / 2); g.fillText(String(8 - i), M / 2, (i + 0.5) * cell); }
  // NPC：圓點＋名字第一個字（放大時顯示全名）
  for (const n of NPCS) { const [x, y] = P(n.x, n.z), r = big ? 11 : 7, ic = NPC_ICON[n.id];
    if (ic && TMM.icons.complete && TMM.icons.naturalWidth) g.drawImage(TMM.icons, ic[0] * 32, ic[1] * 32, 32, 32, x - r, y - r, r * 2, r * 2); // 原版圖示
    else { g.beginPath(); g.arc(x, y, r * 0.75, 0, 7); g.fillStyle = '#' + n.color.toString(16).padStart(6, '0'); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.stroke(); }
    if (big) { g.fillStyle = '#2a1f12'; g.font = 'bold 11px sans-serif'; g.fillText(n.name.split(' ')[0], x, y + r + 8); } }
  // 玩家箭頭（方向＝角色面向；地圖轉了 180 度所以 x、z 都反過來）
  const [px, py] = P(player.position.x, player.position.z), fx = -Math.sin(player.rotation.y), fy = -Math.cos(player.rotation.y), L = big ? 12 : 8;
  g.save(); g.translate(px, py); g.rotate(Math.atan2(fy, fx) + Math.PI / 2); g.beginPath(); g.moveTo(0, -L); g.lineTo(L * 0.65, L * 0.7); g.lineTo(0, L * 0.3); g.lineTo(-L * 0.65, L * 0.7); g.closePath();

}

// ===== 項目 19：排行榜（六個分頁、職業篩選、前三名金銀銅、自己的角色藍框、每 30 秒更新）=====
let rTab = 'power', rJob = '', rTimer = 0;
const RANK_TABS = [['power', '戰力'], ['base', 'Base 等級'], ['job', 'Job 等級'], ['stage', '關卡進度'], ['kills', '擊殺數'], ['tower', '無盡塔']];
async function openRank(quiet = false) {
  clearTimeout(rTimer);
  let r; try { r = await call('GET', `/api/rank?tab=${rTab}&job=${encodeURIComponent(rJob)}`); } catch (e) { return toast(e.message); }
  if (quiet && !dlgOpen) return; // 背景更新時視窗已關就不再打開
  const fmt = s => `${String(s / 60 | 0).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  const col = { power: ['戰力', x => x.power], base: ['Base', x => `Lv ${x.baseLv}`], job: ['Job', x => `Lv ${x.jobLv}`], stage: ['通關', x => `${x.stages} 張・最久 ${fmt(x.best)}`], kills: ['總擊殺', x => x.kills], tower: ['本月最佳', x => `${x.towerScore.toLocaleString()} 分・第 ${x.towerFloor} 層`] }[rTab];
  const medal = n => ['🥇', '🥈', '🥉'][n - 1] || n;
  // PC 原版 RANKING 視窗（interface/ranking_win.tex）：梯形分頁、米色欄位列、深淺相間的列
  const row = x => `<tr class="${x.mine ? 'me' : ''}${x.rank <= 3 ? ' top' : ''}"><td>${medal(x.rank)}</td><td>${esc(x.name)}</td><td>${esc(x.jobName)}</td><td>${col[1](x)}</td></tr>`;
  const html = `<div class="pcrank"><div class="rk-tabs">${RANK_TABS.map(([k, v]) => `<button class="${rTab === k ? 'on' : ''}" data-rt="${k}">${v}</button>`).join('')}</div>
    <div class="rk-bar"><select id="rJob"><option value="">全部職業</option>${Object.keys(JOBS).map(j => `<option ${rJob === j ? 'selected' : ''}>${j}</option>`).join('')}</select>
      <small style="color:#6b7896">　共 ${r.total ?? 0} 名・每 30 秒更新（${new Date(r.at || Date.now()).toLocaleTimeString()}）・藍框＝你的角色</small></div>
    ${r.note ? `<p>${r.note}</p>` : r.rows.length ? `<table class="rk-t"><tr><th>排名</th><th>角色名稱</th><th>職業</th><th>${col[0]}</th></tr>${r.rows.map(row).join('')}${r.mine?.length ? `<tr><td colspan="4" style="text-align:center">⋯</td></tr>${r.mine.map(row).join('')}` : ''}</table>` : '<p>還沒有人上榜，去當第一名吧！</p>'}
    ${rTab === 'power' ? '<p><small>戰力＝身上裝備的數值換算成分數（攻擊、爆擊、冷卻、移速、吸取、HP、護甲）。</small></p>' : ''}</div>`;
  openDlg('排行榜', html, [], true);
  const b = $('#dlgBody');
  b.querySelectorAll('[data-rt]').forEach(x => x.onclick = () => { rTab = x.dataset.rt; openRank(); });
  $('#rJob').onchange = e => { rJob = e.target.value; openRank(); };
  rTimer = setTimeout(() => { if (dlgOpen && $('#rJob')) openRank(true); }, 30000);
}

// ===== 項目 20：郵差（信箱：系統信＋附件領取、可丟掉）=====
let mails = null, mSel = null;
const matName = k => ORES[k]?.name || { dust: '閃亮粉末', crystal: '閃亮結晶', rainbow: '七彩粉末' }[k] || k;
const attachHtml = m => [m.gold ? `💰 ${m.gold} 金幣` : '', ...m.items.map(it => `<span style="color:${RARITY[it.rarity].color}">${RARITY[it.rarity].name} ${itemName(it)}</span>`), ...Object.entries(m.mats).map(([k, v]) => `${matName(k)} ×${v}`)].filter(Boolean).join('、');
async function openMail(refetch = true) {
  if (refetch || !mails) { try { mails = (await call('GET', '/api/mail/' + CHAR.id)).mails; } catch (e) { return toast(e.message); } }
  const has = m => m.gold || m.items.length || Object.keys(m.mats).length, m = mails.find(x => x.id === mSel);
  const html = `<p>「有你的信喔！」</p>
    <div class="pcmail"><img class="pct-img" src="assets/ui/pc/t_mail.png" alt="MAIL BOX"><div class="pcmail-tab" style="background-image:url(assets/ui/pc/tab_mail_1.png)"></div><div class="pcmail-list">${mails.map(x => `<div class="pcmail-row${mSel === x.id ? ' sel' : ''}${x.read ? ' read' : ''}" data-ml="${x.id}">
      <span class="ic">${has(x) && !x.claimed ? '📦' : '✉️'}</span><div style="flex:1">${x.read ? '' : '<b style="color:#c0392b">● </b>'}<b>${x.title.replace(/</g, '&lt;')}</b>　<small>${x.sender}・${new Date(x.created).toLocaleDateString()}</small><small>${has(x) ? (x.claimed ? '附件已領取' : '📎 ' + attachHtml(x)) : ''}</small></div></div>`).join('') || '<small>信箱是空的</small>'}</div></div>
    <div class="detail">${m ? `<b>${m.title.replace(/</g, '&lt;')}</b>　<small>寄件人：${m.sender}</small><p>${m.body.replace(/</g, '&lt;')}</p>${has(m) ? `<p>附件：${attachHtml(m)}</p>` : ''}
      <div class="acts">${has(m) && !m.claimed ? `<button class="btn primary" id="mClaim">領取</button>` : ''}<button class="btn" id="mDel">丟掉這封</button></div>` : '<small>點一封信來看</small>'}</div>`;
  openDlg(`郵差（${mails.length} 封）`, html, [['全部領取', () => claim('all'), true], ['丟掉已讀且已領取的', () => del(mails.filter(x => x.read && (x.claimed || !has(x))).map(x => x.id))]], true);
  const b = $('#dlgBody');
  b.querySelectorAll('[data-ml]').forEach(x => x.onclick = async () => { mSel = +x.dataset.ml; const mm = mails.find(y => y.id === mSel); if (!mm.read) { mm.read = true; call('POST', '/api/mailread', { charId: CHAR.id, mailId: mSel }).catch(() => {}); } openMail(false); });
  $('#mClaim')?.addEventListener('click', () => claim(mSel));
  $('#mDel')?.addEventListener('click', async () => { if (has(m) && !m.claimed && !(await askConfirm('附件還沒領取，丟掉就沒了，確定？', { danger: true }))) return; del([m.id]); });
  async function claim(id) {
    try { const r = await call('POST', '/api/mailclaim', { charId: CHAR.id, mailId: id }); mails = r.mails; showChar(r.char); openMail(false);
      toast(r.claimed ? `領取了 ${r.claimed} 封信的附件${r.full ? '（背包滿了，有些沒領）' : ''}` : r.full ? '背包滿了' : '沒有可以領的附件'); } catch (e) { toast(e.message); }
  }
  async function del(ids) { if (!ids.length) return toast('沒有可以丟的'); try { mails = (await call('POST', '/api/maildel', { charId: CHAR.id, mailIds: ids })).mails; mSel = null; openMail(false); } catch (e) { toast(e.message); } }

// ===== 項目 18：倉庫管理員（帳號共用倉庫：分頁 1～6、分類、搜尋、排序；點背包＝存入、點倉庫＝取回）=====
let stash = null, sPage = 0, sCat = 'all', sQ = '', sSort = 'rarity';
async function openStash(refetch = true) {
  if (refetch || !stash) { try { stash = await call('GET', '/api/stash'); } catch (e) { return toast(e.message); } }
  const c = CHAR, S = stash, locked = sPage >= S.unlocked;
  const ok = it => (sCat === 'all' || it.slot === sCat) && (!sQ || itemName(it).includes(sQ) || RARITY[it.rarity].name.includes(sQ));

const fmtCd = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; };
const quick = { r: new Set([0]), refined: false };
async function openMerchant(tab) {

  } else if (stockData) {
