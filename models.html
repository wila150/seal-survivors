<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>模型總覽</title>
<style>
body{margin:0;background:#1b2230;color:#cfd8ea;font:12px system-ui,sans-serif;padding:12px}
input{font:inherit;font-size:15px;padding:6px 10px;border-radius:8px;border:0;width:min(300px,90vw)}
#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:10px}
figure{margin:0;background:#9fb6ea;border-radius:8px;overflow:hidden;text-align:center;cursor:pointer}
figure img{width:100%;aspect-ratio:1;display:block}
figcaption{background:#0008;color:#fff;padding:3px;word-break:break-all}
</style></head><body>
<input id="q" placeholder="篩選名稱，例如 T_ 或 N_"> <span id="st"></span>
<div id="g"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { sealModel } from './src/2_core/seal-model.js';
const S = 160;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(S, S);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fb6ea);
scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 1.6)); const d = new THREE.DirectionalLight(0xffffff, 1.2); d.position.set(3, 5, 4); scene.add(d);
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100); cam.position.set(0, 1.2, 4.6); cam.lookAt(0, 0.9, 0);
const list = await (await fetch('assets/models/index.json')).json();
list.sort((a, b) => a.id.localeCompare(b.id));
const params = new URLSearchParams(location.search);
const q = document.getElementById('q'); q.value = params.get('q') || 'T_';
let token = 0;
async function build() {
  const my = ++token, g = document.getElementById('g'); g.innerHTML = '';
  const qs = q.value.toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
  const items = list.filter(x => qs.some(k => x.id.toLowerCase().startsWith(k) || (k.length > 3 && x.id.toLowerCase().includes(k))));
  let i = 0;
  for (const it of items) {
    if (my !== token) return;
    const m = await sealModel(it.id, 1.8).catch(() => null); if (!m) continue;
    m.rotation.y = Math.PI * 0.85; scene.add(m); r.render(scene, cam); scene.remove(m);
    const f = document.createElement('figure'); f.innerHTML = `<img src="${r.domElement.toDataURL('image/jpeg', 0.8)}"><figcaption>${it.id}</figcaption>`;
    f.onclick = () => open('model-viewer.html?spin&m=' + it.id); g.appendChild(f);
    document.getElementById('st').textContent = `${++i} / ${items.length}`;
  }
}
q.onchange = build; build();
</script></body></html>
